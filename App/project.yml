name: Stages
options:
  bundleIdPrefix: dk.creativeoak
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  StagesKit:
    path: ..
  # Auto-updates from GitHub Releases (appcast + EdDSA-signed, notarized zips; `make release`).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
targets:
  StagesApp:
    type: application
    platform: macOS
    sources:
      - path: Stages
        excludes: [AppIcon.icon]
      # Icon Composer file (Liquid Glass app icon); a file reference, not a folder group.
      - path: Stages/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: StagesKit
        product: StageReader
      - package: StagesKit
        product: WindowSource
      - package: StagesKit
        product: StageStore
      - package: StagesKit
        product: Switcher
      - package: StagesKit
        product: Commands
      - package: StagesKit
        product: ActivityLog
      - package: Sparkle
    info:
      path: Stages/Info.plist
      properties:
        CFBundleName: Stages
        CFBundleDisplayName: Stages
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: dk.creativeoak.stages
            CFBundleURLSchemes: [stages]
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Magnus Høholt Kaspersen. AGPL-3.0."
        # Sparkle: the newest release's appcast.xml, attached to every GitHub release.
        SUFeedURL: https://github.com/Creative-Oak/stages/releases/latest/download/appcast.xml
        SUPublicEDKey: ONBQKOPZlFnSYHTzi5vVqR9dkQBc8kdSxZicqHhgybw=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    settings:
      base:
        PRODUCT_NAME: Stages
        PRODUCT_BUNDLE_IDENTIFIER: dk.creativeoak.stages
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Not sandboxed: needs CGWindowList titles, AX and event taps.
        # Signed with a local self-signed identity ("Stages Local Signing", see README) so the
        # designated requirement, and with it the Screen Recording / Accessibility grants,
        # survives rebuilds. Developer ID comes later.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Stages Local Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Distribution: Developer ID + hardened runtime (`make release`). No entitlements are
          # needed: Screen Recording and Accessibility are TCC grants, not entitlements.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
schemes:
  Stages:
    build:
      targets:
        StagesApp: all
    run:
      config: Debug
